<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- White die-cut outline -->
  <polygon points="50,14 12,82 88,82" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" filter="url(#shadow)" />
  <!-- Mountain dark body -->
  <polygon points="50,18 16,78 84,78" fill="#18181b" />
  <!-- Snow cap -->
  <polygon points="50,18 36,44 42,42 50,48 58,40 64,44" fill="#f4f4f5" />
  <!-- Ridges -->
  <path d="M50 48 L46 78 M58 40 L68 78" stroke="#27272a" stroke-width="2" />
  <!-- Peak star -->
  <circle cx="50" cy="10" r="3" fill="#facc15" />
</svg>
